name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: intel-dcapd-linux-amd64
            binary: intel-dcapd
            admin_binary: pccsadmin
          - goos: linux
            goarch: '386'
            name: intel-dcapd-linux-i386
            binary: intel-dcapd
            admin_binary: pccsadmin
          - goos: windows
            goarch: amd64
            name: intel-dcapd-windows-amd64
            binary: intel-dcapd.exe
            admin_binary: pccsadmin.exe
          - goos: windows
            goarch: '386'
            name: intel-dcapd-windows-i386
            binary: intel-dcapd.exe
            admin_binary: pccsadmin.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          LDFLAGS="-s -w -X github.com/KarpelesLab/intel-dcapd/version.Version=${VERSION}"
          go build -ldflags="${LDFLAGS}" -o ${{ matrix.binary }}
          go build -ldflags="${LDFLAGS}" -o ${{ matrix.admin_binary }} ./tools/pccsadmin

      - name: Package binaries (Linux)
        if: matrix.goos == 'linux'
        run: |
          DIRNAME="${{ matrix.name }}-${{ steps.get_version.outputs.version }}"
          ARCHIVE="${{ matrix.name }}.tar.gz"
          mkdir -p dist/$DIRNAME
          cp ${{ matrix.binary }} dist/$DIRNAME/
          cp ${{ matrix.admin_binary }} dist/$DIRNAME/
          cp README.md LICENSE dist/$DIRNAME/
          cp tools/pccsadmin/README.md dist/$DIRNAME/README.pccsadmin.md
          cp contrib/Makefile dist/$DIRNAME/
          cp contrib/intel-dcapd.service.in dist/$DIRNAME/
          cd dist
          tar -czf $ARCHIVE $DIRNAME

      - name: Package binaries (Windows)
        if: matrix.goos == 'windows'
        run: |
          DIRNAME="${{ matrix.name }}-${{ steps.get_version.outputs.version }}"
          ARCHIVE="${{ matrix.name }}.zip"
          mkdir -p dist/$DIRNAME
          cp ${{ matrix.binary }} dist/$DIRNAME/
          cp ${{ matrix.admin_binary }} dist/$DIRNAME/
          cp README.md LICENSE dist/$DIRNAME/
          cp tools/pccsadmin/README.md dist/$DIRNAME/README.pccsadmin.md
          cd dist
          zip -r $ARCHIVE $DIRNAME

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/intel-dcapd-linux-amd64/intel-dcapd-linux-amd64.tar.gz
            artifacts/intel-dcapd-linux-i386/intel-dcapd-linux-i386.tar.gz
            artifacts/intel-dcapd-windows-amd64/intel-dcapd-windows-amd64.zip
            artifacts/intel-dcapd-windows-i386/intel-dcapd-windows-i386.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
